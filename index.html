<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <meta name="description" content="ISO//SWEEP — an endless monochrome isometric interception game.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070809'/%3E%3Cpath d='M16 6 26 16 16 26 6 16Z' fill='none' stroke='%23eef0ef' stroke-width='1.5' stroke-dasharray='2 3'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23eef0ef'/%3E%3C/svg%3E">
  <title>ISO // SWEEP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Isometric wireframe arena. Press space or tap to slide to the nearest enemy signal."></canvas>

    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="hud hud-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <div class="brand-copy">
          <span class="eyebrow">ENDLESS ISOMETRIC PROTOCOL</span>
          <h1>ISO<span>//</span>SWEEP</h1>
        </div>
      </div>

      <div class="score-panel" aria-live="polite">
        <div class="score-label">
          <span>SYNC SCORE</span>
          <span class="live-dot" aria-hidden="true"></span>
        </div>
        <div class="score" id="score">00000</div>
        <div class="chain-row">
          <span class="chain" id="chain">CHAIN ×1</span>
          <span class="chain-track" aria-hidden="true"><i id="chainMeter"></i></span>
        </div>
      </div>
    </header>

    <div class="status" id="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText">SYNCED</span>
    </div>

    <div class="side-label side-left" aria-hidden="true">WIREFRAME / 01</div>
    <div class="side-label side-right" aria-hidden="true">INFINITE FIELD</div>

    <footer class="hud hud-bottom">
      <div class="uptime">
        <span class="meta-label">UPTIME</span>
        <span id="uptime">00:00</span>
      </div>

      <div class="hint" id="hint">
        <kbd>SPACE</kbd>
        <span class="hint-copy" id="hintCopy">SLIDE TO NEAREST SIGNAL</span>
      </div>

      <div class="kills">
        <span id="kills">000</span>
        <span class="meta-label">SIGNALS CLEARED</span>
      </div>
    </footer>

    <div class="intro" id="intro">
      <span class="intro-rule" aria-hidden="true"></span>
      <p>PRESS <kbd>SPACE</kbd> TO INTERCEPT</p>
      <span class="intro-rule" aria-hidden="true"></span>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>

    <div class="frame" aria-hidden="true">
      <i class="corner corner-t l"></i>
      <i class="corner corner-t r"></i>
      <i class="corner corner-b l"></i>
      <i class="corner corner-b r"></i>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
